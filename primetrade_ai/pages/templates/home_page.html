<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Prime Trade AI - Dashboard</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                background: radial-gradient(circle at top left, #1e293b, #020617);
                color: #f8fafc;
                font-family: 'Inter', sans-serif;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            nav {
                background: rgba(15, 23, 42, 0.8);
                backdrop-filter: blur(12px);
                border-bottom: 1px solid rgba(51, 65, 85, 0.5);
                padding: 16px 40px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                position: sticky;
                top: 0;
                z-index: 100;
            }

            .brand {
                font-size: 20px;
                font-weight: 700;
                color: #ffffff;
                letter-spacing: -0.5px;
            }

            .nav-right {
                display: flex;
                align-items: center;
                gap: 24px;
            }

            .user-info {
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .username {
                font-size: 14px;
                font-weight: 500;
                color: #cbd5e1;
            }

            .admin-badge {
                background: rgba(220, 38, 38, 0.2);
                color: #fca5a5;
                border: 1px solid rgba(220, 38, 38, 0.3);
                padding: 4px 8px;
                border-radius: 4px;
                font-size: 11px;
                font-weight: 600;
                text-transform: uppercase;
                display: none;
            }

            .logout-btn {
                background: transparent;
                color: #94a3b8;
                border: 1px solid #334155;
                padding: 8px 16px;
                border-radius: 6px;
                font-size: 13px;
                font-weight: 500;
                cursor: pointer;
                transition: all 0.2s ease;
            }

            .logout-btn:hover {
                background: rgba(255, 255, 255, 0.05);
                color: #ffffff;
            }

            main {
                padding: 40px;
                max-width: 1200px;
                margin: 0 auto;
                width: 100%;
                display: grid;
                grid-template-columns: 350px 1fr;
                gap: 32px;
                flex: 1;
            }

            .panel {
                background: rgba(15, 23, 42, 0.6);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(51, 65, 85, 0.5);
                border-radius: 12px;
                padding: 24px;
                height: fit-content;
            }

            h2 {
                font-size: 18px;
                font-weight: 600;
                margin-bottom: 24px;
                color: #ffffff;
            }

            .form-group {
                margin-bottom: 20px;
            }

            label {
                display: block;
                margin-bottom: 8px;
                font-size: 13px;
                font-weight: 500;
                color: #cbd5e1;
            }

            input, textarea {
                width: 100%;
                padding: 12px 16px;
                background-color: rgba(2, 6, 23, 0.5);
                border: 1px solid #334155;
                border-radius: 8px;
                color: #ffffff;
                font-size: 14px;
                transition: all 0.3s ease;
                font-family: inherit;
            }

            textarea {
                resize: vertical;
                min-height: 100px;
            }

            input:focus, textarea:focus {
                outline: none;
                border-color: #3b82f6;
                box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
                background-color: rgba(2, 6, 23, 0.8);
            }

            .btn-primary {
                width: 100%;
                padding: 12px;
                background: linear-gradient(135deg, #2563eb, #1d4ed8);
                color: #ffffff;
                border: none;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: transform 0.2s ease, box-shadow 0.2s ease;
            }

            .btn-primary:hover {
                transform: translateY(-1px);
                box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
            }

            .notes-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                gap: 20px;
            }

            .note-card {
                background: rgba(30, 41, 59, 0.5);
                border: 1px solid rgba(51, 65, 85, 0.6);
                border-radius: 10px;
                padding: 20px;
                display: flex;
                flex-direction: column;
                transition: border-color 0.2s ease;
            }

            .note-card:hover {
                border-color: #3b82f6;
            }

            .note-header {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                margin-bottom: 12px;
            }

            .note-symbol {
                font-size: 16px;
                font-weight: 700;
                color: #3b82f6;
                background: rgba(59, 130, 246, 0.1);
                padding: 4px 10px;
                border-radius: 6px;
            }

            .note-user {
                font-size: 12px;
                color: #64748b;
            }

            .note-content {
                font-size: 14px;
                color: #e2e8f0;
                line-height: 1.6;
                flex-grow: 1;
                margin-bottom: 20px;
            }

            .note-actions {
                display: flex;
                gap: 10px;
                justify-content: flex-end;
            }

            .btn-small {
                background: transparent;
                border: 1px solid #334155;
                color: #cbd5e1;
                padding: 6px 12px;
                border-radius: 4px;
                font-size: 12px;
                font-weight: 500;
                cursor: pointer;
                transition: all 0.2s ease;
            }

            .btn-small.edit:hover {
                background: rgba(59, 130, 246, 0.1);
                border-color: #3b82f6;
                color: #60a5fa;
            }

            .btn-small.delete:hover {
                background: rgba(239, 68, 68, 0.1);
                border-color: #ef4444;
                color: #f87171;
            }

            .status-msg {
                margin-top: 12px;
                font-size: 13px;
                text-align: center;
                min-height: 20px;
            }
        </style>
    </head>
    <body>
        <nav>
            <div class="brand">Prime Trade AI</div>
            <div class="nav-right">
                <div class="user-info">
                    <span id="adminBadge" class="admin-badge">Admin Mode</span>
                    <span id="usernameDisplay" class="username">Loading...</span>
                </div>
                <button class="logout-btn" onclick="logout()">Sign Out</button>
            </div>
        </nav>

        <main>
            <div class="panel">
                <h2>Create Trade Note</h2>
                <form id="createNoteForm">
                    <div class="form-group">
                        <label for="symbol">Market Symbol</label>
                        <input type="text" id="symbol" placeholder="e.g. BTC/USD" required>
                    </div>
                    <div class="form-group">
                        <label for="note">Trading Thesis</label>
                        <textarea id="note" placeholder="Enter your analysis..." required></textarea>
                    </div>
                    <button type="submit" class="btn-primary" id="submitBtn">Save Note</button>
                    <div id="formMsg" class="status-msg"></div>
                </form>
            </div>

            <div class="panel">
                <h2>Active Watchlist</h2>
                <div id="notesGrid" class="notes-grid"></div>
            </div>
        </main>

        <script>
            const API_BASE = '/api/v1';

            function getAuthHeaders() {
                const token = localStorage.getItem('access_token');
                if (!token) {
                    //window.location.href = '/login/';
                    return null;
                }
                return {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                };
            }

            function logout() {
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                window.location.href = '/login/';
            }

            async function initDashboard() {
                const headers = getAuthHeaders();
                if (!headers) return;

                try {
                    const profileRes = await fetch(`${API_BASE}/auth/me/`, { headers });
                    if (!profileRes.ok) throw new Error('Auth failed');
                    
                    const profile = await profileRes.json();
                    document.getElementById('usernameDisplay').textContent = profile.username;
                    
                    if (profile.is_staff) {
                        document.getElementById('adminBadge').style.display = 'block';
                    }

                    loadNotes();
                } catch (error) {
                    logout();
                }
            }

            async function loadNotes() {
                const headers = getAuthHeaders();
                try {
                    const res = await fetch(`${API_BASE}/tradenotes/`, { headers });
                    if (!res.ok) throw new Error('Failed to fetch notes');
                    
                    const notes = await res.json();
                    const grid = document.getElementById('notesGrid');
                    grid.innerHTML = '';

                    notes.forEach(note => {
                        const card = document.createElement('div');
                        card.className = 'note-card';
                        card.innerHTML = `
                            <div class="note-header">
                                <span class="note-symbol">${note.symbol}</span>
                                <span class="note-user">Author: ${note.user_details?.username || 'User'}</span>
                            </div>
                            <div class="note-content">${note.note}</div>
                            <div class="note-actions">
                                <button class="btn-small edit" onclick="editNote(${note.id}, '${note.symbol}', '${note.note.replace(/'/g, "\\'")}')">Edit</button>
                                <button class="btn-small delete" onclick="deleteNote(${note.id})">Delete</button>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                } catch (error) {
                    console.error('Error loading notes:', error);
                }
            }

            document.getElementById('createNoteForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const headers = getAuthHeaders();
                const submitBtn = document.getElementById('submitBtn');
                const formMsg = document.getElementById('formMsg');
                
                const symbol = document.getElementById('symbol').value;
                const note = document.getElementById('note').value;

                submitBtn.disabled = true;
                formMsg.textContent = 'Saving...';
                formMsg.style.color = '#94a3b8';

                try {
                    const res = await fetch(`${API_BASE}/tradenotes/`, {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify({ symbol, note })
                    });

                    if (res.ok) {
                        document.getElementById('createNoteForm').reset();
                        formMsg.textContent = 'Note saved successfully.';
                        formMsg.style.color = '#34d399';
                        loadNotes();
                    } else {
                        throw new Error('Failed to save');
                    }
                } catch (error) {
                    formMsg.textContent = 'Error saving note.';
                    formMsg.style.color = '#f87171';
                } finally {
                    submitBtn.disabled = false;
                    setTimeout(() => formMsg.textContent = '', 3000);
                }
            });

            async function deleteNote(id) {
                if (!confirm('Are you sure you want to delete this note?')) return;
                
                const headers = getAuthHeaders();
                try {
                    const res = await fetch(`${API_BASE}/tradenotes/${id}/`, {
                        method: 'DELETE',
                        headers: headers
                    });

                    if (res.ok) {
                        loadNotes();
                    } else {
                        alert('Error: You do not have permission to delete this note.');
                    }
                } catch (error) {
                    console.error('Delete failed:', error);
                }
            }

            async function editNote(id, currentSymbol, currentNote) {
                const newNote = prompt(`Edit your thesis for ${currentSymbol}:`, currentNote);
                if (newNote === null || newNote === currentNote) return;

                const headers = getAuthHeaders();
                try {
                    const res = await fetch(`${API_BASE}/tradenotes/${id}/`, {
                        method: 'PATCH',
                        headers: headers,
                        body: JSON.stringify({ note: newNote })
                    });

                    if (res.ok) {
                        loadNotes();
                    } else {
                        alert('Error: You do not have permission to edit this note.');
                    }
                } catch (error) {
                    console.error('Update failed:', error);
                }
            }

            document.addEventListener('DOMContentLoaded', initDashboard);
        </script>
    </body>
</html>
