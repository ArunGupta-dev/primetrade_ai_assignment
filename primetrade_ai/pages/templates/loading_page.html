<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Trade AI - Loading...</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0a0b0e;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .brand-title {
            color: #ffffff;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
        }

        /* 4-Bubble Loading Animation */
        .loading-bubbles {
            display: flex;
            gap: 12px;
            opacity: 0;
            animation: fadeIn 1s ease-out 0.3s forwards;
        }

        .bubble {
            width: 16px;
            height: 16px;
            background-color: #3b82f6; /* Prime Trade Blue */
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        /* Staggered animation delays for the wave effect */
        .bubble:nth-child(1) { animation-delay: -0.45s; }
        .bubble:nth-child(2) { animation-delay: -0.30s; }
        .bubble:nth-child(3) { animation-delay: -0.15s; }
        .bubble:nth-child(4) { animation-delay: 0s; }

        .status-text {
            margin-top: 24px;
            font-size: 14px;
            color: #94a3b8;
            font-weight: 400;
            opacity: 0;
            animation: fadeIn 1s ease-out 0.6s forwards;
        }

        /* Keyframes */
        @keyframes bounce {
            0%, 80%, 100% { 
                transform: scale(0);
                opacity: 0.3;
            }
            40% { 
                transform: scale(1);
                opacity: 1;
                background-color: #60a5fa;
            }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <h1 class="brand-title">Prime Trade AI</h1>
    
    <div class="loading-bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="status-text" id="statusText">Authenticating secure connection...</div>

    <script>
        // Execute the auth check as soon as the DOM is ready
        document.addEventListener('DOMContentLoaded', async () => {
            const statusText = document.getElementById('statusText');

            try {
                const token = localStorage.getItem('access_token');
                const headers = {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                };

                console.log(token);
                
                // If the user has a JWT, attach it
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }

                const response = await fetch('/api/v1/auth/auto_auth/', {
                    method: 'GET', 
                    headers: headers
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    statusText.textContent = "Routing...";

                    // Adjust the keys 'user_type' or 'status' to match your actual DRF JSON response
                    if (data.code === 'authenticated') {
                        // Add a slight delay for a smooth transition experience
                        setTimeout(() => {
                            window.location.href = '/home/'; // Redirect to home/dashboard
                        }, 800);
                    } else {
                        setTimeout(() => {
                            window.location.href = '/signup/'; // Redirect to auth page
                        }, 800);
                    }
                } else {
                    // Handle 401 Unauthorized or other server errors
                    statusText.textContent = "Session expired. Redirecting to login...";
                    setTimeout(() => {
                        window.location.href = '/signup/'; // Fallback to auth page
                    }, 1200);
                }

            } catch (error) {
                console.error("Auth check failed:", error);
                statusText.textContent = "Network error. Please try again.";
                statusText.style.color = "#ef4444"; // Red error color
            }
        });
    </script>

</body>
</html>
