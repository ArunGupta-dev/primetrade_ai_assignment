<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Prime Trade AI - Sign In</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                background: radial-gradient(circle at top left, #1e293b, #020617);
                color: #f8fafc;
                font-family: 'Inter', sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }

            .auth-container {
                background: rgba(15, 23, 42, 0.6);
                backdrop-filter: blur(12px);
                padding: 48px 40px;
                border-radius: 16px;
                width: 100%;
                max-width: 440px;
                border: 1px solid rgba(51, 65, 85, 0.5);
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            }

            h1 {
                color: #ffffff;
                font-size: 28px;
                margin-bottom: 8px;
                text-align: center;
                font-weight: 700;
                letter-spacing: -0.5px;
            }

            .subtitle {
                text-align: center;
                color: #94a3b8;
                font-size: 14px;
                margin-bottom: 32px;
            }

            .form-group {
                margin-bottom: 24px;
            }

            label {
                display: block;
                margin-bottom: 8px;
                font-size: 13px;
                font-weight: 500;
                color: #cbd5e1;
            }

            input {
                width: 100%;
                padding: 14px 16px;
                background-color: rgba(2, 6, 23, 0.5);
                border: 1px solid #334155;
                border-radius: 8px;
                color: #ffffff;
                font-size: 14px;
                transition: all 0.3s ease;
            }

            input:focus {
                outline: none;
                border-color: #3b82f6;
                box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
                background-color: rgba(2, 6, 23, 0.8);
            }

            button {
                width: 100%;
                padding: 14px;
                background: linear-gradient(135deg, #2563eb, #1d4ed8);
                color: #ffffff;
                border: none;
                border-radius: 8px;
                font-size: 15px;
                font-weight: 600;
                cursor: pointer;
                transition: transform 0.2s ease, box-shadow 0.2s ease;
                margin-top: 8px;
                box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            }

            button:hover {
                transform: translateY(-1px);
                box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
            }

            button:active {
                transform: translateY(1px);
            }

            button:disabled {
                background: #1e3a8a;
                cursor: not-allowed;
                opacity: 0.7;
                transform: none;
                box-shadow: none;
            }

            .auth-links {
                margin-top: 24px;
                text-align: center;
                font-size: 14px;
                color: #94a3b8;
            }

            .auth-links a {
                color: #3b82f6;
                text-decoration: none;
                font-weight: 500;
                transition: color 0.2s ease;
            }

            .auth-links a:hover {
                color: #60a5fa;
            }

            .message {
                margin-top: 16px;
                text-align: center;
                font-size: 13px;
                min-height: 20px;
                font-weight: 500;
            }

            .error {
                color: #f87171;
            }

            .success {
                color: #34d399;
            }
        </style>
    </head>
    <body>
        <div class="auth-container">
            <h1>Prime Trade AI</h1>
            <div class="subtitle">Welcome back, please sign in</div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>

                <button type="submit" id="submitBtn">Sign In</button>
                <div id="message" class="message"></div>
            </form>

            <div class="auth-links">
                Don't have an account? <a href="/signup/">Create one here</a>
            </div>
        </div>

        <script>
            async function checkSession() {
                const access = localStorage.getItem('access_token');
                const refresh = localStorage.getItem('refresh_token');

                if (!access) return;

                try {
                    let response = await fetch('/api/v1/auth/auto_auth/', {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${access}`,
                            'Accept': 'application/json'
                        }
                    });

                    if (response.ok) {
                        window.location.href = '/home/';
                        return;
                    }

                    if (response.status === 401 && refresh) {
                        const refreshResponse = await fetch('/api/v1/auth/token/refresh/', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Accept': 'application/json'
                            },
                            body: JSON.stringify({ refresh: refresh })
                        });

                        if (refreshResponse.ok) {
                            const refreshData = await refreshResponse.json();
                            localStorage.setItem('access_token', refreshData.access);
                            window.location.href = '/home/';
                        } else {
                            localStorage.removeItem('access_token');
                            localStorage.removeItem('refresh_token');
                        }
                    }
                } catch (error) {
                    console.error(error);
                }
            }

            document.getElementById('loginForm').addEventListener('submit', async function(e) {
                e.preventDefault();

                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const messageEl = document.getElementById('message');
                const submitBtn = document.getElementById('submitBtn');

                messageEl.textContent = '';
                messageEl.className = 'message';

                submitBtn.disabled = true;
                submitBtn.textContent = 'Authenticating...';

                try {
                    const response = await fetch('/api/v1/auth/login/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        localStorage.setItem('access_token', data.access);
                        localStorage.setItem('refresh_token', data.refresh);
                        
                        messageEl.textContent = 'Authentication successful. Redirecting...';
                        messageEl.classList.add('success');
                        
                        setTimeout(() => {
                            window.location.href = '/home/';
                        }, 1000);
                    } else {
                        const errorText = data.detail || 'Invalid username or password.';
                        messageEl.textContent = errorText;
                        messageEl.classList.add('error');
                    }
                } catch (error) {
                    messageEl.textContent = 'Network error. Ensure your Django server is running.';
                    messageEl.classList.add('error');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In';
                }
            });

            document.addEventListener('DOMContentLoaded', checkSession);
        </script>
    </body>
</html>
